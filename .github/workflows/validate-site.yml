name: Validar site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validacoes estaticas
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de validacao
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts

      - name: Testar verificadores do site
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Validar sintaxe JavaScript
        run: node --check frontend/assets/js/script.js

      - name: Testar navegacao, responsividade e acessibilidade no Chromium
        run: |
          python -m playwright install --with-deps chromium
          python tools/browser_check.py

      - name: Auditar pagina inicial com Lighthouse
        run: python tools/lighthouse_check.py

      - name: Anexar relatorio Lighthouse
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-home
          path: test-results/lighthouse-home.json
          if-no-files-found: warn
          retention-days: 14

      - name: Anexar capturas atuais do site
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-previews
          path: test-results/site-previews/*.png
          if-no-files-found: warn
          retention-days: 14


      - name: Validar dependencias do backend
        run: |
          python - <<'PY'
          from pathlib import Path

          for requirements in (Path("backend/requirements.txt"), Path("requirements-dev.txt")):
              dependencies = []
              for line in requirements.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if "==" not in line:
                      raise SystemExit(f"Dependencia sem pin exato em {requirements}: {line}")
                  name, version = line.split("==", 1)
                  if not name.strip() or not version.strip():
                      raise SystemExit(f"Dependencia invalida em {requirements}: {line}")
                  dependencies.append(line)

              if not dependencies:
                  raise SystemExit(f"{requirements} nao possui dependencias validas")

              print(f"{requirements} OK: {len(dependencies)} pins exatos")
          PY

      - name: Validar sintaxe Python
        run: python -m py_compile backend/app.py

      - name: Instalar dependencias do backend
        run: python -m pip install -r backend/requirements.txt

      - name: Rodar testes Python
        run: python -m pytest backend

      - name: Auditar dependencias Python
        run: python -m pip_audit -r backend/requirements.txt

      - name: Validar vercel.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));

          if (!Array.isArray(config.redirects)) {
            throw new Error('vercel.json precisa de redirects.');
          }

          if (!Array.isArray(config.rewrites)) {
            throw new Error('vercel.json precisa de rewrites.');
          }

          if (!Array.isArray(config.headers)) {
            throw new Error('vercel.json precisa de headers.');
          }

          if (!Array.isArray(config.routes) || config.routes.length < 2) {
            throw new Error('vercel.json precisa bloquear caminhos internos com routes.');
          }

          const internalRoutes = config.routes.filter((rule) => rule.status === 404);
          if (internalRoutes.length < 2 || !internalRoutes.some((rule) => rule.src.includes('backend'))) {
            throw new Error('Rotas internas precisam retornar HTTP 404.');
          }

          const deployAllowlist = fs.readFileSync('.vercelignore', 'utf8')
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter((line) => line && !line.startsWith('#'));
          const expectedAllowlist = ['/*', '!frontend', '!404.html', '!vercel.json'];
          if (JSON.stringify(deployAllowlist) !== JSON.stringify(expectedAllowlist)) {
            throw new Error('.vercelignore precisa manter a allowlist minima de deploy.');
          }

          const catchAllRewrite = config.rewrites.find((rule) => rule.source === '/(.*)');
          if (catchAllRewrite) {
            throw new Error('Nao use rewrite catch-all para 404, pois pode retornar HTTP 200.');
          }

          const globalHeaders = config.headers.find((rule) => rule.source === '/(.*)');
          const assetHeaders = config.headers.find((rule) => rule.source === '/assets/(.*)');
          const requiredHeaders = ['X-Content-Type-Options', 'Referrer-Policy', 'Permissions-Policy'];

          for (const header of requiredHeaders) {
            if (!globalHeaders?.headers?.some((item) => item.key === header)) {
              throw new Error(`Header global ausente: ${header}`);
            }

            if (!assetHeaders?.headers?.some((item) => item.key === header)) {
              throw new Error(`Header de assets ausente: ${header}`);
            }
          }

          const cacheHeader = assetHeaders?.headers?.find((item) => item.key === 'Cache-Control');
          const maxAge = Number(cacheHeader?.value?.match(/(?:^|,\s*)max-age=(\d+)/)?.[1]);
          if (!Number.isInteger(maxAge) || maxAge < 86400 || maxAge > 2592000 || !cacheHeader.value.includes('must-revalidate')) {
            throw new Error('Cache-Control de assets precisa usar 1 a 30 dias com must-revalidate.');
          }

          if (cacheHeader.value.includes('immutable')) {
            throw new Error('Nao use immutable em /assets/* enquanto CSS, JS e imagens tiverem nomes fixos.');
          }

          const cspHeader = globalHeaders?.headers?.find((item) => item.key === 'Content-Security-Policy');
          if (!cspHeader) {
            throw new Error('Content-Security-Policy ausente nos headers globais.');
          }

          const assetCspHeader = assetHeaders?.headers?.find((item) => item.key === 'Content-Security-Policy');
          if (!assetCspHeader) {
            throw new Error('Content-Security-Policy ausente nos headers de assets.');
          }

          const hstsHeader = globalHeaders?.headers?.find((item) => item.key === 'Strict-Transport-Security');
          const hstsMaxAge = Number(hstsHeader?.value?.match(/max-age=(\d+)/)?.[1]);
          if (!Number.isInteger(hstsMaxAge) || hstsMaxAge < 15552000 || /includeSubDomains|preload/i.test(hstsHeader.value)) {
            throw new Error('HSTS precisa usar ao menos seis meses, sem includeSubDomains ou preload nesta fase.');
          }

          const requiredCspDirectives = [
            "default-src 'self'",
            "script-src 'self'",
            "style-src 'self'",
            "object-src 'none'",
            "frame-ancestors 'none'",
            "base-uri 'self'",
            "form-action 'self' mailto:",
          ];

          for (const directive of requiredCspDirectives) {
            if (!cspHeader.value.includes(directive)) {
              throw new Error(`Diretiva CSP ausente: ${directive}`);
            }
          }

          console.log('vercel.json OK');
          NODE

      - name: Validar sitemap
        run: |
          node tools/generate-sitemap.js --check
          node - <<'NODE'
          const fs = require('node:fs');

          const sitemap = fs.readFileSync('frontend/sitemap.xml', 'utf8');
          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const urls = [...sitemap.matchAll(/<url>\s*<loc>([^<]+)<\/loc>\s*<lastmod>([^<]+)<\/lastmod>\s*<\/url>/g)];

          if (urls.length === 0) {
            throw new Error('sitemap.xml nao possui URLs validas com lastmod.');
          }

          const rewrites = new Set(vercel.rewrites.map((rule) => rule.source));

          for (const [, loc, lastmod] of urls) {
            const url = new URL(loc);

            if (url.origin !== 'https://m2rtecnologias.vercel.app') {
              throw new Error(`URL fora do dominio oficial: ${loc}`);
            }

            if (!/^\d{4}-\d{2}-\d{2}$/.test(lastmod)) {
              throw new Error(`lastmod invalido em ${loc}: ${lastmod}`);
            }

            const path = url.pathname === '/' ? '/' : url.pathname.replace(/\/$/, '');
            if (!rewrites.has(path)) {
              throw new Error(`URL do sitemap sem rewrite correspondente: ${path}`);
            }
          }

          console.log(`sitemap OK: ${urls.length} URLs`);
          NODE

      - name: Validar versoes dos assets
        run: node tools/version-assets.js --check

      - name: Validar HTML e CSS
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root404 = fs.readFileSync('404.html', 'utf8').replace(/\r\n/g, '\n');
          const frontend404 = fs.readFileSync('frontend/404.html', 'utf8').replace(/\r\n/g, '\n');
          if (root404 !== frontend404) {
            throw new Error('404.html e frontend/404.html precisam permanecer iguais.');
          }

          const htmlFiles = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(fullPath);
              else if (entry.name.endsWith('.html')) htmlFiles.push(fullPath);
            }
          };

          walk('frontend');
          htmlFiles.push('404.html');

          const issues = [];
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');

            if (!/<html\s+lang="pt-BR"/.test(html)) {
              issues.push(`${file}: atributo lang pt-BR ausente`);
            }

            if (!/<title>[^<]+<\/title>/.test(html)) {
              issues.push(`${file}: title ausente`);
            }

            if (!/<meta\s+name="description"\s+content="[^"]+"/.test(html)) {
              issues.push(`${file}: meta description ausente`);
            }

            if (!/<main\s+id="conteudo-principal"/.test(html)) {
              issues.push(`${file}: main conteudo-principal ausente`);
            }

            if (!/class="skip-link"/.test(html)) {
              issues.push(`${file}: skip link ausente`);
            }

            if (/\son[a-z]+\s*=/.test(html)) {
              issues.push(`${file}: handler inline encontrado`);
            }
          }

          const css = fs.readFileSync('frontend/assets/css/style.css', 'utf8');
          const openBraces = (css.match(/\{/g) || []).length;
          const closeBraces = (css.match(/\}/g) || []).length;
          if (openBraces !== closeBraces) {
            issues.push(`style.css: chaves desbalanceadas (${openBraces} abertas, ${closeBraces} fechadas)`);
          }

          if (/style="/.test(css)) {
            issues.push('style.css: atributo style= nao deve aparecer no CSS');
          }

          if (!css.includes('@media (prefers-reduced-motion: reduce)')) {
            issues.push('style.css: prefers-reduced-motion ausente');
          }

          if (!css.includes('scroll-behavior: auto')) {
            issues.push('style.css: reducao de movimento precisa desativar smooth scroll');
          }

          const contato = fs.readFileSync('frontend/pages/contato.html', 'utf8');
          for (const expected of [
            'autocomplete="name"',
            'autocomplete="email"',
            'autocomplete="tel"',
            'maxlength="120"',
            'maxlength="254"',
            'maxlength="30"',
            'maxlength="2000"',
          ]) {
            if (!contato.includes(expected)) {
              issues.push(`contato.html: atributo esperado ausente: ${expected}`);
            }
          }

          const m2rServer = fs.readFileSync('frontend/pages/projetos/m2r-server.html', 'utf8');
          const progressTags = m2rServer.match(/<progress\b[^>]*>/g) || [];
          for (const tag of progressTags) {
            if (!tag.includes('aria-label=')) {
              issues.push(`m2r-server.html: progress sem nome acessivel: ${tag}`);
            }
          }

          if (issues.length) {
            throw new Error(issues.join('\n'));
          }

          console.log(`HTML e CSS OK: ${htmlFiles.length} paginas`);
          NODE

      - name: Conferir links internos e CSP
        run: |
          python tools/site_tools.py check
          python tools/site_tools.py security
          python -m unittest discover -s tools -p "test_*.py" -v

      - name: Bloquear Google Fonts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(fullPath);
              else if (/\.(html|css|js)$/.test(entry.name)) files.push(fullPath);
            }
          };

          walk('frontend');

          const offenders = files.filter((file) => {
            const content = fs.readFileSync(file, 'utf8');
            return content.includes('fonts.googleapis') || content.includes('fonts.gstatic');
          });

          if (offenders.length) {
            throw new Error(`Google Fonts encontrado em:\n${offenders.join('\n')}`);
          }

          console.log('fontes externas OK');
          NODE

      - name: Conferir dimensoes das imagens
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const htmlFiles = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(fullPath);
              else if (entry.name.endsWith('.html')) htmlFiles.push(fullPath);
            }
          };

          walk('frontend');
          htmlFiles.push('404.html');

          const issues = [];
          const imgPattern = /<img\b[^>]*>/g;

          for (const file of htmlFiles) {
            const content = fs.readFileSync(file, 'utf8');

            for (const match of content.matchAll(imgPattern)) {
              const tag = match[0];
              if (!/\bwidth="/.test(tag)) issues.push(`${file}: imagem sem width: ${tag}`);
              if (!/\bheight="/.test(tag)) issues.push(`${file}: imagem sem height: ${tag}`);
            }
          }

          if (issues.length) {
            throw new Error(issues.join('\n'));
          }

          console.log('dimensoes de imagens OK');
          NODE
